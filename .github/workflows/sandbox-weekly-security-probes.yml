name: Sandbox weekly security probes

# Weekly protected-route drift check + live auth-negative probes against
# sandbox (and optionally prod via NEOTOMA_PROBE_HOSTS). Does not require
# Fly SSH or a running sandbox VM — only HTTP reachability for probes.

on:
  schedule:
    # Sunday 00:05 UTC (same window as the retired scheduled global reset)
    - cron: "5 0 * * 0"
  workflow_dispatch:

# Extended from `contents: read` to also `issues: write` — needed ONLY by the
# "Alert on failure" step below, which opens/updates a single tracking issue
# rather than granting blanket write access to the whole job.
permissions:
  contents: read
  issues: write

concurrency:
  group: sandbox-weekly-security-probes
  cancel-in-progress: true

jobs:
  probes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Sync protected routes manifest (drift check)
        run: npm run security:manifest:check

      - name: Run deployed protected-route probes (sandbox + prod)
        env:
          NEOTOMA_PROBE_HOSTS: ${{ secrets.NEOTOMA_PROBE_HOSTS || 'https://sandbox.neotoma.io' }}
        run: |
          mkdir -p docs/security/probes
          bash scripts/security/deployed_probes.sh \
            --tag "weekly-$(date -u +%Y-%m-%d)" \
            --out "docs/security/probes/weekly-$(date -u +%Y-%m-%d).md"

      - name: Upload probe report
        id: upload_report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-security-probes
          path: docs/security/probes/weekly-*.md

      # A scheduled workflow's failure is only a red mark in a tab nobody
      # opens — this went unnoticed for three straight weeks (2026-09-06,
      # -09-13, -09-20) before anyone ran `gh run list` by hand. Files/updates
      # ONE tracking issue (matched by title) instead of opening a new issue
      # every week, so the alert stays visible without becoming its own noise.
      - name: Alert on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "CI: Sandbox weekly security probes failing";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const artifactId = "${{ steps.upload_report.outputs.artifact-id }}";
            const artifactUrl = artifactId
              ? `${runUrl}/artifacts/${artifactId}`
              : null;
            const today = new Date().toISOString().slice(0, 10);

            const body = [
              `**Workflow:** \`sandbox-weekly-security-probes.yml\` (Gate G5)`,
              `**Date:** ${today}`,
              `**Run:** ${runUrl}`,
              artifactUrl
                ? `**Probe report artifact:** ${artifactUrl}`
                : `**Probe report artifact:** not available (upload step did not produce an artifact id — check the run log)`,
              ``,
              `The weekly deployed protected-route probe run (or the manifest drift check ahead of it) failed. Open the run log and the linked artifact to see which routes returned unexpected statuses before assuming this is calibration drift — treat it as a possible real exposure until checked against \`scripts/security/protected_routes_manifest.json\`.`,
            ].join("\n");

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const match = existing.find((i) => i.title === title);

            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body,
              });
              console.log(`Commented on existing issue #${match.number}`);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["incident"],
              });
              console.log("Opened new tracking issue");
            }
