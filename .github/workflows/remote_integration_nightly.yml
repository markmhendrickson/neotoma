name: Remote integration nightly

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

# Extended from `contents: read` to also `issues: write` — needed ONLY by the
# "Alert on failure" step below, which opens/updates a single tracking issue
# rather than granting blanket write access to the whole job.
permissions:
  contents: read
  issues: write

concurrency:
  group: remote-integration-nightly
  cancel-in-progress: true

jobs:
  remote_integration:
    if: ${{ vars.CI_REMOTE_TESTS_ENABLED == '1' }}
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run remote critical suite
        env:
          WRITE_TEST_RUN_REPORT: "1"
        run: npm run test:remote:critical

      - name: Upload Markdown test run report
        id: upload_report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-integration-report
          path: .vitest/reports/
          if-no-files-found: ignore
          retention-days: 21

      # A scheduled workflow's failure is only a red mark in a tab nobody
      # opens. Files/updates ONE tracking issue (matched by title) instead of
      # opening a new issue every night, so the alert stays visible without
      # becoming its own noise.
      #
      # Tracker discovery uses the issues SEARCH API with an `in:title`
      # qualifier (one call, does not degrade as the open-issue backlog
      # grows) rather than paginating `listForRepo` — see
      # scripts/security/alert_tracker_discovery.mjs and
      # tests/security/alert_tracker_discovery.test.ts for why: the prior
      # first-page-only lookup silently missed the tracker once the repo
      # passed 100 open issues, opening a duplicate every night instead of
      # commenting on the existing one.
      #
      # The whole body runs inside try/catch: if the alert step itself
      # throws (bad token scope, API outage, a bug here), the failure is
      # still surfaced via core.setFailed rather than the job silently
      # reporting only the original job failure with no trace of the
      # alert having broken too.
      - name: Alert on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const title = "CI: Remote integration nightly failing";
              const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              const artifactId = "${{ steps.upload_report.outputs.artifact-id }}";
              const artifactUrl = artifactId
                ? `${runUrl}/artifacts/${artifactId}`
                : null;
              const today = new Date().toISOString().slice(0, 10);

              const body = [
                `**Workflow:** \`remote_integration_nightly.yml\``,
                `**Date:** ${today}`,
                `**Run:** ${runUrl}`,
                artifactUrl
                  ? `**Test run report artifact:** ${artifactUrl}`
                  : `**Test run report artifact:** not available (no report produced, or the upload step did not produce an artifact id — check the run log)`,
                ``,
                `The nightly remote critical test suite failed. Check the run log and the linked report for which test(s) regressed.`,
              ].join("\n");

              // Search is tokenized, not literal-equality, so every
              // candidate is re-checked for an EXACT title match before
              // being treated as the tracker.
              const owner = context.repo.owner;
              const repo = context.repo.repo;
              const q = `repo:${owner}/${repo} is:issue state:open in:title "${title}"`;
              const { data: found } = await github.rest.search.issuesAndPullRequests({
                q,
                per_page: 30,
              });
              const match = found.items.find(
                (i) => !i.pull_request && i.title === title,
              );

              if (match) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: match.number,
                  body,
                });
                console.log(`Commented on existing issue #${match.number}`);
              } else {
                await github.rest.issues.create({
                  owner,
                  repo,
                  title,
                  body,
                  labels: ["incident"],
                });
                console.log("Opened new tracking issue");
              }
            } catch (err) {
              core.setFailed(
                `Alert-on-failure step itself threw — the original job failure above did NOT get a tracking issue or comment: ${err.message}\n${err.stack ?? ""}`,
              );
            }
