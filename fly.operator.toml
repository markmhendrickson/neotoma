# Fly.io config for an OPERATOR-RUN Neotoma instance.
#
# THIS REPO IS PUBLIC. No instance-identifying value belongs in this file — no
# app name, no hostname, no codename. Pass the app at deploy time:
#
#   flyctl deploy -c fly.operator.toml --app <app> --primary-region <region>
#
# Same reasoning as .github/workflows/deploy-client-instance.yml, which reads
# the app name from a repository secret. PR #2001 was closed for reintroducing
# a client app name into this repo; do not re-add one here in any form.
#
# WHY THIS FILE EXISTS
#
# Deploying an operator instance with the shared fly.toml silently RESIZES the
# machine, because that file declares `[[vm]] memory = '1gb'` / `cpus = 1` for
# the sandbox. A 4GB instance reverts to 1GB on the next deploy with no warning.
# That happened in production on 2026-08-04: an instance scaled to 2 CPU / 4GB
# to address query stalls was reverted by a deploy, and the stalls returned.
#
# The documented workaround was to re-run `flyctl machine update --vm-memory ...`
# after every deploy. That is a manual step in a runbook, and it was forgotten
# exactly once before causing an outage. This file makes the sizing declarative
# so the deploy is safe by construction instead of by discipline.
#
# Sizing is not cosmetic here. Node's default heap ceiling is ~2GB, so a 1GB
# machine puts the V8 limit above available RAM — see neotoma#2094, where an
# in-process memory kill is the leading hypothesis for repeated clean exits.
# Deploying that config onto a loaded instance would make the failure constant
# rather than intermittent.
#
# WHAT DIFFERS FROM fly.toml
#   - [[vm]]      2 CPU / 4096MB, not the sandbox's 1 CPU / 1GB
#   - [[restart]] policy = 'always' (see below)
#   - no VITE_NEOTOMA_SANDBOX_UI, and VITE_PUBLIC_BASE_PATH = "/"
#   - primary_region is NOT set — pass --primary-region, since the volume's
#     region is instance-specific and fly.toml's 'lhr' would fail machine
#     creation with "needs an unattached volume named 'data' in region 'lhr'"

[build]
  dockerfile = "Dockerfile"

[build.args]
  # Operator instances serve the full Inspector, not the sandbox UI.
  VITE_NEOTOMA_SANDBOX_UI = ""
  VITE_PUBLIC_BASE_PATH = "/"

# Seed the schema_registry before the new release takes traffic (issue #1968).
# Idempotent: skips entity types that already have an active registration.
[deploy]
  release_command = "node dist/seed_schemas_entry.js"

[env]
  NODE_ENV = "production"
  NEOTOMA_ENV = "production"
  # Must match internal_port (Fly routes to this port on the machine)
  HTTP_PORT = "3180"
  NEOTOMA_HTTP_PORT = "3180"

[http_service]
  internal_port = 3180
  force_https = true
  # Keep one machine running. MCP-over-HTTP transport sessions are held in
  # process memory (`mcpTransports` in src/actions.ts), so any machine stop
  # invalidates every live session — clients then get "MCP session is unknown
  # or expired" and cannot self-recover (neotoma#2100).
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  # Health check for LOAD-BALANCER ROUTING ONLY. A check declared under
  # [http_service] is a *service* check: it decides whether the Fly proxy
  # sends traffic to a machine. It does NOT restart one. Restart behavior is
  # the [[restart]] block below.
  #
  # `/ready`, not `/health` — see the long note in fly.toml. `/health` returns
  # 200 during a total read outage because it never touches the database, and
  # a check pointed at it makes an outage invisible rather than detected.
  #
  # 30s timeout, not 10s: a loaded operator instance was measured answering in
  # 13-24s on 2026-09-01 while serving correctly. With min_machines_running = 1
  # a check that flaps on a slow-but-working server takes the only machine out
  # of rotation, which is a worse outcome than the slowness it detected.
  #
  # That same instance was watched degrading over a few hours on 2026-09-01:
  # /health answered in 15.4s, then 26.8s, then 31.6s, and then stopped
  # completing a TLS handshake at all (on both the Cloudflare hostname and the
  # direct .fly.dev one, so the instance itself, not the edge).
  #
  # Two things follow. A 10s timeout would have fired during the healthy-but-
  # slow phase and pulled the only machine, converting slowness into an outage.
  # And 30s is not a ceiling on real answers either: past ~31s this endpoint was
  # minutes away from serving nothing, so a check failing there is reporting a
  # genuine problem rather than being impatient. If a future instance is
  # legitimately slower than this, fix the instance — do not raise the timeout
  # until the check can no longer fail.
  # grace_period 60s, which is also the ceiling Fly enforces. A service check
  # declaring more is silently lowered:
  #
  #   WARN Service HTTP check has a grace period greater than 1 minute (2m0s);
  #        this will be lowered to 1 minute
  #
  # `flyctl config validate` prints that and still exits 0, so the larger value
  # parses, deploys, and reads as authoritative while never taking effect. This
  # file previously declared 120s and justified it by the [deploy]
  # release_command plus boot migrations — neither of which it bought. The
  # release_command runs in its own ephemeral machine before the app machine
  # starts, so it is not inside this budget at all.
  #
  # 60s is not tight. Measured on the largest operator instance (2 CPU / 8GB,
  # 20GB volume) on 2026-09-01: 17.7s from machine start to first passing
  # check, migrations and readiness probe included.
  [[http_service.checks]]
    interval = '30s'
    timeout = '30s'
    grace_period = '60s'
    method = 'GET'
    path = '/ready'

[[mounts]]
  source = "data"
  destination = "/app/data"

# Restart whenever the process ends, INCLUDING a clean exit.
#
# Fly's default policy is `on-failure`, which ignores exit code 0 by
# definition: the platform reads a clean exit as "the job finished" and
# declines to restart. The server does exit 0 periodically (neotoma#2094), and
# under `on-failure` the machine then stays stopped until an inbound request
# wakes it — a 33-45s cold start against a normal 0.2s.
#
# `always` is the only policy that covers a code-0 exit. Note the TOML must be
# `[[restart]]` (array of tables); `[restart]` fails flyctl validation with
# "cannot unmarshal object into Go struct field Config.restart".
[[restart]]
  policy = 'always'

# SIZED FOR THE LARGEST OPERATOR INSTANCE, DELIBERATELY. This file names no app
# and is shared across every operator-run instance via `--app` at deploy time,
# so one guest declaration has to serve all of them. It is reapplied verbatim
# and overwrites the running machine's guest with no warning in the deploy
# output. Check what you are about to overwrite:
#
#   scripts/check_fly_config_drift.sh --app <app> -c fly.operator.toml
#
# These three values are the VERIFIED running state of the largest operator
# instance, read from the live machine on 2026-09-01:
#
#   flyctl machine list --app <app> --json | jq '.[].config.guest'
#   -> { "cpu_kind": "performance", "cpus": 2, "memory_mb": 8192 }
#
# It was scaled up by hand after repeated exit-134 (V8 heap OOM) aborts and
# never written back here. This file previously declared shared/2 CPU/4GB, so
# deploying it would have downgraded BOTH halves of that guest.
#
# The CPU half is the more dangerous of the two, because it is quieter. An
# undersized heap announces itself with an OOM abort and a restart; a downgrade
# from `performance` to `shared` on a datastore under real query load just makes
# every read slower, which reads as "the database is degraded" rather than "the
# last deploy shrank the machine". Both halves are declared here for that
# reason.
#
# THE TRADEOFF, STATED: this oversizes smaller instances. Two other Neotoma
# machines run shared/1 CPU/1GB today, so this file already grew them at 4GB and
# grows them further now. That direction is the safe one. A config that silently
# SHRINKS a running machine causes an outage and reports success; one that
# oversizes costs money and keeps serving. Until sizing is genuinely
# per-instance, err toward the machine that needs the most — and run the drift
# check first, which reports either direction before a deploy applies it.
[[vm]]
  memory = '8gb'
  cpu_kind = 'performance'
  cpus = 2
