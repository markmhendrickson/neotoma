endpoint: "POST /observations/create"
outcome: rejected
error_code: RESERVED_OBSERVATION_SOURCE
hint_match: "correct({ entity_id, field, value })"
notes: |
  POST /observations/create accepted `source_priority: 1000`, the priority
  `correct()` stamps. Since #2033 that value is reserved for corrections on
  every client write entrance, so this route rejects it with
  RESERVED_OBSERVATION_SOURCE and writes nothing.
