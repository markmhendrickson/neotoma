endpoint: POST /register_schema
outcome: rejected
error_code: SCHEMA_VALIDATION_FAILED
hint_match: /fixed count on the inner part/
notes: Schema registration reads a counted quantifier ({n}, {n,} or {n,m}) with a count of any number of digits, including zero-padded counts, the same way the regular-expression engine does. A pattern whose repeated group has a variable-length part and a count above the accepted limit is refused with refusal kind "shape" and the same hint as other shape refusals, which suggests a fixed count on the inner part, removing the inner quantifier, or repeating the group at most 5 times (MAX_OUTER_REPEAT_WITH_VARIABLE_INNER). Schemas that are already stored keep loading.
