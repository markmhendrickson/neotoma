# Default Fly config for a Neotoma deployment.
#
# See https://fly.io/docs/reference/configuration/ for how to use this file.
#
# NO `app` FIELD ON PURPOSE — always pass `--app <name>`.
#
# This file previously declared `app = 'neotoma-sandbox'`, which was wrong and
# actively harmful: the public sandbox deploys from fly.sandbox.toml (its own
# build args, env, and volume), and no automated workflow uses this file at all.
# The stale name only ever mis-targeted MANUAL deploys — a `flyctl deploy` run
# in the repo to ship some other instance would silently retarget the sandbox
# and succeed, giving no signal that the wrong app had been updated.
#
# Omitting `app` converts that silent mis-target into an explicit failure:
#   $ flyctl deploy -c fly.toml
#   Error: the config for your app is missing an app name, add an app field to
#          the fly.toml file or specify with the -a flag
#
# Per-instance values (app name, region, secrets) belong with the instance, not
# in this shared file — see docs/infrastructure/client_instance_deployment.md.
# `primary_region` below is only a default for new apps; existing apps keep
# whatever region their machines already run in.

primary_region = 'lhr'

[build]

# Seed the schema_registry on every deploy, before the new release takes
# traffic (issue #1968). The server also seeds idempotently at boot
# (src/services/schema_registry_bootstrap.ts); this makes the step explicit
# and surfaces a seeding failure in the deploy log rather than a warn line.
#
# Safe to re-run: seed_schemas_entry.js skips entity types that already have
# an active registration and never overwrites a custom operator schema.
[deploy]
  release_command = "node dist/seed_schemas_entry.js"

[env]
  NODE_ENV = "production"
  NEOTOMA_ENV = "production"
  # Must match internal_port (Fly routes to this port on the machine)
  HTTP_PORT = "3180"
  NEOTOMA_HTTP_PORT = "3180"

[http_service]
  internal_port = 3180
  force_https = true
  # Keep one machine running. MCP-over-HTTP transport sessions are held in
  # process memory (`mcpTransports` in src/actions.ts), so ANY machine
  # stop/start silently invalidates every live session. Idle clients then hit
  # "MCP session is unknown or expired on this API instance" and have to
  # re-initialize — which surfaces to a user as an unexplained auth/session
  # timeout after a quiet period. Letting the last machine stop trades a
  # trivial amount of compute for a client-visible failure.
  #
  # fly.sandbox.toml already runs min_machines_running = 1 for this reason;
  # this aligns the default so any instance deployed from this config inherits
  # the safe behavior instead of having to rediscover it.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  # Health check for LOAD-BALANCER ROUTING ONLY. A check declared under
  # [http_service] is a *service* check: it decides whether the Fly proxy sends
  # traffic to a machine. It does NOT restart one. An earlier version of this
  # comment claimed it restarted the machine "regardless of how it stopped" —
  # that was wrong, and it made the deployment look self-healing when it was
  # not. Restart behavior is the [restart] block below.
  #
  # The path is `/ready`, NOT `/health`. `/health` reads package.json off disk
  # and never touches the database, so it answers 200 throughout a total read
  # outage — measured 2026-08-31, `/health` 200 in 0.89s while every query
  # timed out at 45s (ateles#577, ateles#635). A check pointed at it converts
  # an outage into a silent one. `/ready` runs a bounded real SELECT.
  #
  # Timeouts are sized for a slow-but-alive server, not a fast one. On
  # 2026-09-01 a loaded production instance answered /health in 13-24s while
  # serving correctly; a 10s timeout would have pulled a working machine out of
  # rotation, and with min_machines_running = 1 that is a self-inflicted
  # outage. 30s tolerates that, and /ready's own probe bound (20s, see
  # NEOTOMA_READY_DB_TIMEOUT_MS) returns an explicit 503 before it — a wedged
  # instance that answers "not ready" is diagnosable; one that answers nothing
  # is indistinguishable from a network fault.
  #
  # grace_period 60s, which is also the ceiling Fly enforces. A service check
  # declaring more is silently lowered:
  #
  #   WARN Service HTTP check has a grace period greater than 1 minute (2m0s);
  #        this will be lowered to 1 minute
  #
  # `flyctl config validate` prints that and still exits 0, so the larger value
  # parses, deploys, and reads as authoritative while never taking effect. This
  # file previously declared 120s and justified it by the [deploy]
  # release_command plus boot migrations — neither of which it bought. The
  # release_command runs in its own ephemeral machine before the app machine
  # starts, so it is not inside this budget at all.
  #
  # 60s is not tight. Measured on the largest operator instance (2 CPU / 8GB,
  # 20GB volume) on 2026-09-01: 17.7s from machine start to first passing
  # check, migrations and readiness probe included.
  [[http_service.checks]]
    interval = '30s'
    timeout = '30s'
    grace_period = '60s'
    method = 'GET'
    path = '/ready'

# Restart the machine whenever the process ends, INCLUDING a clean exit.
#
# Fly's default policy is `on-failure`, which by definition ignores exit code 0:
# the platform reads a clean exit as "the job finished" and declines to restart.
# The server does exit 0 periodically with no error (neotoma#2094, root cause
# still unknown), and under `on-failure` the machine then stays stopped until an
# inbound request happens to wake it. That cold start is what users experience —
# measured at 33-45s, with intermittent 503s, against a normal 0.2s.
#
# `always` is the only policy that covers a code-0 exit. Verified on a hosted
# instance 2026-08-05: no exits in ~40 minutes where they had been occurring
# every ~16, and worst-case latency dropped from 45s to ~2.3s.
#
# This is a safety net, NOT a fix for #2094 — the process should not be exiting
# in the first place.
[[restart]]
  policy = 'always'

# SIZING IS REAPPLIED ON EVERY DEPLOY. Whatever is declared here overwrites the
# running machine's guest config — `flyctl deploy` does not merge, and it prints
# no warning when it shrinks a machine.
#
# 1GB/shared-cpu-1x was the wrong default to leave here. Node's default heap
# ceiling is ~2GB, so a 1GB machine puts the V8 limit above available RAM
# (neotoma#2094), and this file has silently reverted a manually-scaled
# instance more than once — 2026-08-04 and again 2026-09-01, the second time
# taking the operator's instance from slow to unreachable for ~30 minutes.
#
# 2GB/shared-cpu-2x is a floor that will not OOM a small instance on the first
# real query, not a recommendation for a loaded one. An instance carrying real
# traffic should deploy from its own config: fly.operator.toml (4GB) for an
# operator instance, or a per-instance file. Check what the machine is running
# before deploying this file over it:
#
#   flyctl machine list --app <app> --json | jq '.[].config.guest'
[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 2

[[mounts]]
  source = "data"
  destination = "/app/data"
