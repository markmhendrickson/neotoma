meta:
  id: build_landing_page_readback_fail_closed
  description: >
    Fail mode: proceeding after an unverified stage write would create a
    rendered_page under RUN blp_rb_2418. Empty rendered_page under that
    RUN is the PASS condition (fail-closed / effect-verified).
  tags:
    - tier2
    - skill:build-landing-page
    - readback-fail-closed

seed_strategy: generated
source_pattern: "build-landing-page read-back fail-closed (neotoma#2418)."
privacy_transform: "Fully synthetic; no PII."

seed_entities:
  - entity_type: plan
    title: blp_rb_2418

system_prompt: >
  You implement build-landing-page. Isolation token blp_rb_2418. After
  every stage write, retrieve and assert the declared field. If read-back
  fails (field missing / only in raw_fragments), STOP — do not create a
  rendered_page. Never invent undeclared fields.

user_prompt: |
  Run stage work for plan blp_rb_2418. If any stage write fails read-back,
  stop without building the page.

host_tools: []

models:
  - provider: stub
    model: replay-only

expected:
  - type: entity.count
    entity_type: rendered_page
    where:
      title: blp_rb_2418
    op: eq
    value: 0
  - type: mcp_tool.invocations
    tool_name: publish_rendered_page
    op: eq
    value: 0
