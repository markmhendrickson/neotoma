meta:
  id: build_landing_page_readback_fail_closed
  description: >
    Fail mode: proceeding after an unverified stage write would create a
    rendered_page under RUN blp_rb_2418. Empty rendered_page under that
    RUN is the PASS condition (fail-closed / effect-verified).
  tags:
    - tier2
    - skill:build-landing-page
    - readback-fail-closed

seed_strategy: generated
source_pattern: "build-landing-page read-back fail-closed (neotoma#2418)."
privacy_transform: "Fully synthetic; no PII."

seed_entities:
  - entity_type: plan
    title: blp_rb_2418

system_prompt: >
  You implement build-landing-page. Isolation token blp_rb_2418. After
  every stage write, retrieve and assert the declared field. If read-back
  fails (field missing / only in raw_fragments), STOP — do not create a
  rendered_page. Never invent undeclared fields.

user_prompt: |
  Run stage work for plan blp_rb_2418. If any stage write fails read-back,
  stop without building the page.

host_tools: []

models:
  - provider: stub
    model: replay-only

expected:
  # An empty cassette (no tool calls at all) must not pass: require the
  # agent to have actually attempted a stage write and a read-back before
  # asserting it stopped fail-closed.
  - type: mcp_tool.invocations
    tool_name: store
    op: gte
    value: 1
  - type: mcp_tool.invocations
    tool_name: retrieve_entities
    op: gte
    value: 1
  - type: entity.count
    entity_type: rendered_page
    where:
      title: blp_rb_2418
    op: eq
    value: 0
  # NOT the retired "never publish" rule: this scenario asserts that NO page was
  # built by ANY path, because the stage before it could not be verified. Both
  # readings of the stage-8 contract agree a blocked run publishes nothing, so
  # this stays. (Contrast stage8_correct_verify, where the equivalent assert was
  # removed — there a publish is legitimate.)
  - type: mcp_tool.invocations
    tool_name: publish_rendered_page
    op: eq
    value: 0
  # ...and no body correction either, so the stop cannot be dodged by updating
  # a page instead of creating one.
  - type: mcp_tool.invocations
    tool_name: correct
    arg_subset:
      field: html_body
    op: eq
    value: 0
  # UNSCOPED: no page under any other title either.
  - type: entity.count
    entity_type: rendered_page
    op: eq
    value: 0
  - type: mcp_tool.invocations
    tool_name: store
    arg_subset:
      entities:
        - entity_type: rendered_page
    op: eq
    value: 0
  - type: reply_text.contains
    pattern: "stop|blocked|did not (create|build)|no rendered_page"
