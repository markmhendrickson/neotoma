meta:
  id: build_landing_page_readback_fail_closed
  description: >
    A mid-run stage writes its payload to an UNDECLARED field. /store accepts
    it and returns 2xx — the field is routed to raw_fragments and is NOT on
    the snapshot. The read-back therefore cannot confirm the value, and the
    run must STOP rather than proceed to the build. EMPTY IS THE PASS here:
    no rendered_page under the run marker is the asserted success condition,
    not a missing assertion. Fails when the stage treats success:true as
    evidence and builds a page on a stage whose content reads as nothing.
    Scoped to the RUN token "blp-fc-2418".
  tags:
    - tier2
    - skill:build-landing-page
    - stage-contract
    - fail-closed

seed_strategy: generated
source_pattern: >
  /store accepts undeclared fields and silently routes them to raw_fragments,
  so the write succeeds, the snapshot lacks the field, and a later stage reads
  nothing and proceeds confidently. Four agents hit this shape in one day.
privacy_transform: "Fully synthetic product; no PII."

seed_entities:
  - entity_type: plan
    title: blp-fc-2418 Meridian Ledger landing page
    status: active
  # Upstream stages are already settled, so the ONLY reason the run can fail
  # to reach the build is the unverified stage — not missing inputs.
  - entity_type: target_persona
    name: blp-fc-2418 ICP
    archetype: finance ops lead
    core_jtbd: close the month without chasing spreadsheets
  - entity_type: cta
    name: blp-fc-2418 CTA
    title: Start a tracked close
    content: "PRIMARY CTA: Start a tracked close. SUCCESS METRIC: first tracked close within 30 days."

system_prompt: >
  You are an assistant integrated with the Neotoma memory system, running the
  build-landing-page skill for "Meridian Ledger", RUN token "blp-fc-2418".
  The ICP and the CTA are already settled and seeded.

  The entity contract binds every stage: write only DECLARED fields, then READ
  THE WRITE BACK and assert the specific field you wrote holds the value you
  wrote. A 2xx and a success:true are not evidence. `task` declares
  title/description/status/priority/assignee/due_date and related fields — it
  does not declare `finding_body`.

  Store the research finding for this run as a `task` entity titled
  "blp-fc-2418 finding", putting the finding text in `finding_body`. Then read
  it back and check that field.

  STOP THE RUN if a stage's entity cannot be verified. Do not proceed to the
  build stage, and do not create a rendered_page, on an unverified stage. A
  later stage reading a field that silently landed in raw_fragments reads
  nothing and proceeds confidently, which is worse than stopping. Say plainly
  that you are stopping and which field failed its read-back.

user_prompt: |
  Continue the Meridian Ledger landing page: store the research finding, then build the page.

host_tools: []

models:
  - provider: stub
    model: replay-only

expected:
  # The write DID succeed — this is not a scenario about a failed call.
  - type: entity.exists
    entity_type: task
    where:
      title: blp-fc-2418 finding
  # ...and the payload is NOT on the snapshot. This is the unverifiable
  # read-back that must stop the run.
  - type: snapshot.field_absent
    entity_type: task
    where:
      title: blp-fc-2418 finding
    field: finding_body
  # ── EMPTY IS THE PASS ──
  # No page was built on the unverified stage.
  - type: entity.count
    entity_type: rendered_page
    where:
      title: blp-fc-2418 page
    op: eq
    value: 0
  # ...and none under any other title either, so the stop cannot be dodged by
  # renaming the page.
  - type: entity.count
    entity_type: rendered_page
    op: eq
    value: 0
  # No build-stage tool call was made at all — neither the create/publish path
  # nor a body correction.
  - type: mcp_tool.invocations
    tool_name: store
    arg_subset:
      entities:
        - entity_type: rendered_page
    op: eq
    value: 0
  - type: mcp_tool.invocations
    tool_name: correct
    arg_subset:
      field: html_body
    op: eq
    value: 0
  - type: mcp_tool.invocations
    tool_name: publish_rendered_page
    op: eq
    value: 0
  # The agent actually attempted the read-back rather than trusting the 2xx.
  - type: mcp_tool.invocations
    tool_name: retrieve_entities
    arg_subset:
      entity_type: task
    op: gte
    value: 1
  # The stop is explicit and legible, not a silent absence.
  - type: reply_text.contains
    pattern: "(stopping|cannot proceed|not verified|read-back failed|blocker)"
