meta:
  id: store_keyed_write_resume
  description: >
    A keyed multi-entity store that is refused after its idempotency key was
    recorded leaves the key unfinished (#2144). After the cause is fixed,
    retrying the SAME key and payload must finish the write: every entity gets
    an observation and a snapshot, and the call is not reported as a replay of
    a finished write. A further call is an ordinary dedup replay that reports
    exactly the four observations (no duplicates from the resume), and a
    changed payload under the key is refused with ERR_IDEMPOTENCY_MISMATCH.
    The fault is a schema constraint refusal, which happens after the keyed
    source row exists; the harness fault proxy fails a request before it
    reaches the handler, so it cannot produce a half-applied write. Design
    basis: docs/architecture/idempotence_pattern.md#store-write-completion-store-mcp-store.
  tags:
    - tier2
    - store
    - idempotency
    - eval-coverage
seed_strategy: generated
source_pattern: An agent retrying a keyed batch store after a failed or timed-out
  attempt must end with every entity written, never a success that reports only
  the entities that landed before the failure.
privacy_transform: Synthetic entity type and values only. Scripted replay
  cassette, no recorded user data or model output.
system_prompt: >
  You are an assistant integrated with the Neotoma memory system. Persist batches
  with store and a stable idempotency_key. If a keyed store fails, fix the cause
  and retry with the same key and payload.
user_prompt: |
  Store four notes under one idempotency key. The first attempt will be refused by
  a limit constraint; relax the constraint and retry the same key, then repeat the
  call once more, and finally try the key with a different payload.
host_tools: []
models:
  - provider: stub
    model: replay-only
instruction_profile: auto
expected:
  - type: mcp_tool.invocations
    tool_name: store
    op: eq
    value: 4
  # 0: refused by the limit constraint, nothing reported as written.
  - type: tool_result.matches
    tool_name: store
    which: 0
    result_key: error
    present: true
  # 1: the same key finishes the write. All four entities carry an observation
  # and a snapshot, and it is not answered as a replay of a finished write.
  - type: tool_result.matches
    tool_name: store
    which: 1
    result_key: error
    present: false
  - type: tool_result.matches
    tool_name: store
    which: 1
    result_subset:
      replayed: false
      observations_created: 4
  - type: tool_result.matches
    tool_name: store
    which: 1
    result_key: entities.0.observation_id
    present: true
  - type: tool_result.matches
    tool_name: store
    which: 1
    result_key: entities.1.observation_id
    present: true
  - type: tool_result.matches
    tool_name: store
    which: 1
    result_key: entities.2.observation_id
    present: true
  - type: tool_result.matches
    tool_name: store
    which: 1
    result_key: entities.3.observation_id
    present: true
  - type: tool_result.matches
    tool_name: store
    which: 1
    result_key: entities.3.entity_snapshot_after
    present: true
  - type: tool_result.matches
    tool_name: store
    which: 1
    result_key: entities.4
    present: false
  # 2: a further call is a dedup replay of the finished write, reporting
  # exactly four observations: the resume wrote no duplicates.
  - type: tool_result.matches
    tool_name: store
    which: 2
    result_subset:
      replayed: true
      entities_created: 0
      observations_created: 4
  # 3: a changed payload under the same key is refused.
  - type: tool_result.matches
    tool_name: store
    which: 3
    result_key: error
    present: true
  - type: tool_result.matches
    tool_name: store
    which: 3
    result_subset:
      error:
        response:
          error:
            code: ERR_IDEMPOTENCY_MISMATCH
  # Exactly four entities exist at the end.
  - type: entity.count
    entity_type: eval_resume_note
    op: eq
    value: 4
