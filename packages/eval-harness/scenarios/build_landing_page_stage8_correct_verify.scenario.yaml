meta:
  id: build_landing_page_stage8_correct_verify
  description: >
    Fail mode: using publish_rendered_page (success-noop) or recreating the
    page would leave MARKER_A, create a second page, or skip correct on
    html_body. Stable id + MARKER_B via correct is the pass.
  tags:
    - tier2
    - skill:build-landing-page
    - stage8-correct

seed_strategy: generated
source_pattern: "build-landing-page stage-8 correct (not publish) (neotoma#2418)."
privacy_transform: "Fully synthetic; no PII."

seed_entities:
  - entity_type: plan
    title: blp_s8_2418
  - entity_type: rendered_page
    title: blp_s8_2418
    slug: blp_s8_2418
    html_body: "<p>MARKER_A</p>"

system_prompt: >
  You implement build-landing-page stage 8 update. Isolation token
  blp_s8_2418. An existing rendered_page already has title/slug
  blp_s8_2418. Update html_body with correct (field html_body) — NEVER
  publish_rendered_page. Keep the entity id stable. Persist conversation.

user_prompt: |
  Rebuild the landing page for blp_s8_2418. Correct the existing
  rendered_page html_body to contain MARKER_B (replace MARKER_A). Do not
  call publish_rendered_page.

host_tools: []

models:
  - provider: stub
    model: replay-only

expected:
  - type: mcp_tool.invocations
    tool_name: correct
    op: gte
    value: 1
    arg_subset:
      field: html_body
      entity_id: ent_c014c446092723f046af596f
  - type: mcp_tool.invocations
    tool_name: publish_rendered_page
    op: eq
    value: 0
  - type: entity.count
    entity_type: rendered_page
    where:
      title: blp_s8_2418
    op: eq
    value: 1
  - type: entity.exists
    entity_type: rendered_page
    where:
      title: blp_s8_2418
      html_body: "<p>MARKER_B</p>"
  - type: entity.count
    entity_type: rendered_page
    where:
      html_body: "<p>MARKER_A</p>"
    op: eq
    value: 0
  - type: snapshot.field_present
    entity_type: rendered_page
    where:
      title: blp_s8_2418
      html_body: "<p>MARKER_B</p>"
    field: html_body
