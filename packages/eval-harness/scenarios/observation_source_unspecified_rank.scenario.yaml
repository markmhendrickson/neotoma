meta:
  id: observation_source_unspecified_rank
  description: "Replay real store calls on the built-in task type's notes
    field, whose merge strategy is highest_priority, and read the winner back
    through retrieve_entity_snapshot. A newer write with observation_source
    omitted (stored as unspecified) must beat an older explicit llm_summary
    write, because an unlisted unspecified ranks level with llm_summary and
    recency decides; an older sensor write must still beat a newer omitted
    one. Design basis: #2241; src/services/observation_source_rank.ts."
  tags:
    - tier2
    - store
    - provenance
    - eval-coverage
seed_strategy: generated
source_pattern: "Before #2241 an omitted observation_source was stored as
  llm_summary; the same callers' writes now store unspecified. The reducer
  ranks observation_source before recency on highest_priority fields, so if
  unspecified ranked below llm_summary a caller's newer update would silently
  lose to its own older value while the store reported success."
# Every store passes the same explicit source_priority (90), so numeric
# priority ties and the observation_source rank decides; a non-default
# priority also keeps SOURCE_PRIORITY_ESCALATION out of store_warnings.
privacy_transform: Synthetic tasks only. Scripted replay cassette, no
  recorded user data or model output.
system_prompt: Store each supplied synthetic task update with the
  observation_source given, then read each task's snapshot back.
user_prompt: Update one task's notes first as llm_summary and then with
  observation_source omitted, update a second task's notes first as sensor and
  then with observation_source omitted, and read back both snapshots.
host_tools: []
models:
  - provider: stub
    model: replay-only
expected:
  # (A) older explicit llm_summary, then newer omitted-source on task.notes.
  - type: tool_result.matches
    tool_name: store
    which: 0
    result_key: store_warnings.0
    present: false
  - type: tool_result.matches
    tool_name: store
    which: 1
    result_subset:
      store_warnings:
        - code: OBSERVATION_SOURCE_OMITTED
          entity_type: task
  - type: tool_result.matches
    tool_name: store
    which: 1
    result_key: store_warnings.1
    present: false
  # Both writes landed on one task, and the newer omitted-source
  # (unspecified) value is the one read back.
  - type: tool_result.matches
    tool_name: retrieve_entity_snapshot
    which: 0
    result_subset:
      snapshot:
        title: Obs source rank llm then omitted
        notes: newer omitted-source note
      observation_count: 2
  # (B) older explicit sensor, then newer omitted-source on task.notes.
  - type: tool_result.matches
    tool_name: store
    which: 2
    result_key: store_warnings.0
    present: false
  - type: tool_result.matches
    tool_name: store
    which: 3
    result_subset:
      store_warnings:
        - code: OBSERVATION_SOURCE_OMITTED
          entity_type: task
  - type: tool_result.matches
    tool_name: store
    which: 3
    result_key: store_warnings.1
    present: false
  # Both writes landed on one task, and sensor still outranks unspecified,
  # so the older sensor value is kept.
  - type: tool_result.matches
    tool_name: retrieve_entity_snapshot
    which: 1
    result_subset:
      snapshot:
        title: Obs source rank sensor then omitted
        notes: older sensor note
      observation_count: 2
  # Each pair of writes resolved to one task, so exactly two tasks exist.
  - type: entity.count
    entity_type: task
    op: eq
    value: 2
