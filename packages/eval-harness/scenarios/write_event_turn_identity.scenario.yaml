meta:
  id: write_event_turn_identity
  description: >
    A client sends conversation-turn identity with its writes, and the server
    records it on the durable write-event log without the agent reporting it
    (docs/subsystems/write_events.md). Three store calls: one with the turn in
    MCP `_meta` over the real /mcp route, one with the turn in
    X-Neotoma-Turn-Key / X-Neotoma-Conversation-Id headers over REST, and one
    over /mcp that sends BOTH a header and `_meta` with different turn keys.
    Asserts each recorded `created` write event carries the turn it was sent
    with, its carrier (`turn_source`), and that `_meta` wins over the header
    (the header's key is recorded on no event). Turn keys follow the
    `{session}:{turn}` convention (#2440).
  tags:
    - tier2
    - write-events
    - turn-identity
    - eval-coverage

seed_strategy: generated
source_pattern: "Turn summaries and activity views relied on the agent reporting what it wrote; the server recorded no turn identity on its own write log, so a turn's writes could not be listed from server state."
privacy_transform: "Fully synthetic notes and identifiers; no PII."

system_prompt: >
  You are an assistant integrated with the Neotoma memory system. Store each
  note the user asks for with the store tool.

user_prompt: |
  Store three short notes for this turn.

host_tools: []

models:
  - provider: stub
    model: replay-only

expected:
  - type: mcp_tool.invocations
    tool_name: store
    op: eq
    value: 3
  # Carrier 1: MCP `_meta` over /mcp.
  - type: write_event.recorded
    where:
      operation: created
      entity_type: note
      turn_key: "eval-session-we:t1"
      conversation_id: "eval-conv-we"
      turn_source: mcp_meta
    op: eq
    value: 1
  # Carrier 2: HTTP headers over REST.
  - type: write_event.recorded
    where:
      operation: created
      entity_type: note
      turn_key: "eval-session-we:t2"
      conversation_id: "eval-conv-we"
      turn_source: header
    op: eq
    value: 1
  # Both carriers on one /mcp call: `_meta` wins.
  - type: write_event.recorded
    where:
      operation: created
      entity_type: note
      turn_key: "eval-session-we:t3-meta"
      turn_source: mcp_meta
    op: eq
    value: 1
  - type: write_event.recorded
    where:
      turn_key: "eval-session-we:t3-header-loses"
    op: eq
    value: 0
