meta:
  id: atomic_correction_transaction_recovery
  description: Runs correct_transaction on an isolated real server. A stale target
    refuses without partial effects; coordinated corrections commit, uncertain exact
    replay adds no observations, changed payload and a stale final-capacity competitor
    refuse while prior state survives.
  tags:
    - tier2
    - correct-transaction
    - atomicity
    - idempotency
    - conflict-recovery
seed_strategy: generated
source_pattern: A consumer coordinates ordinary corrections across multiple entities
  and must recover an uncertain response without partial transitions or changed-payload
  replay.
privacy_transform: Synthetic schema, titles, values and keys only; no PII.
system_prompt: Use correct_transaction for scoped coordinated corrections. Read and
  bind each target observation count and expected values. Retry an uncertain result
  with the identical payload and key; never force a stale transition.
user_prompt: Seed two ready synthetic drafts and one remaining source unit. Refuse
  an initially stale multi-target request without writing either target. Commit the
  first draft and source unit together, retry the identical uncertain request, then
  refuse changed-payload key reuse and a stale competing draft. Read all target snapshots.
host_tools: []
models:
  - provider: stub
    model: replay-only
