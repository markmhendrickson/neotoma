meta:
  id: atomic_keyed_array_disjoint_writers
  description:
    Runs disjoint keyed patches and stale same-key recovery through the actual isolated HTTP
    tool. Checks structured conflict token, reapplication, exact replay and changed-payload refusal with
    persisted observation counts.
  tags:
    - tier2
    - patch-array-item
    - atomicity
    - lost-update
    - conflict-recovery
    - idempotency
seed_strategy: generated
source_pattern:
  Concurrent whole-array writes could each report success while the later writer erased
  a disjoint row; this replay proves both keyed patches survive.
privacy_transform: Fully synthetic entity type and claim rows; no PII.
system_prompt:
  "You are an assistant integrated with Neotoma. For an array governed by merge_array_by_key,
  use patch_array_item to update one keyed row without replacing rows written by another agent.

  "
user_prompt:
  Register a synthetic keyed claim entity, add independent writer A and B rows, then update
  A. Refuse a stale same-key writer without observation growth; inspect the returned current item/version
  and reapply using that version. Retry the identical recovery request, refuse changed payload/key reuse,
  and read final snapshots preserving B.
host_tools: []
models:
  - provider: stub
    model: replay-only
expected:
  - type: mcp_tool.invocations
    tool_name: patch_array_item
    op: eq
    value: 7
  - type: mcp_tool.invocations
    tool_name: patch_array_item
    arg_subset:
      key_value: writer-a
    op: eq
    value: 6
  - type: mcp_tool.invocations
    tool_name: patch_array_item
    arg_subset:
      key_value: writer-b
    op: eq
    value: 1
  - type: tool_result.matches
    tool_name: patch_array_item
    which: 0
    result_subset:
      array_length: 1
  - type: tool_result.matches
    tool_name: patch_array_item
    which: 1
    result_subset:
      array_length: 2
      snapshot:
        tasks_claimed:
          - claim_id: writer-a
            status: in_review
          - claim_id: writer-b
            status: in_progress
  - type: snapshot.field_present
    entity_id: ent_30d410d89b465f879c2949f8
    field: tasks_claimed
  - type: tool_result.matches
    tool_name: patch_array_item
    which: 0
    result_subset:
      item_version: b0904541e3672fde0fb84c4a86bafa2357d15700f6d4dee80746ce7c477b92a4
  - type: tool_result.matches
    tool_name: patch_array_item
    which: 2
    result_subset:
      item_version: 982867663231c05445a502a0bd73ed0192e5952ddf9f3bf38071304a4bddd7da
      item: &id001
        claim_id: writer-a
        status: approved
      replayed: false
  - type: tool_result.matches
    tool_name: patch_array_item
    which: 3
    result_subset:
      error:
        response:
          error_code: ERR_ARRAY_ITEM_CONFLICT
          details:
            current_item: *id001
            current_item_version: 982867663231c05445a502a0bd73ed0192e5952ddf9f3bf38071304a4bddd7da
            expected_item_version: b0904541e3672fde0fb84c4a86bafa2357d15700f6d4dee80746ce7c477b92a4
  - type: tool_result.matches
    tool_name: patch_array_item
    which: 4
    result_subset:
      item: &id002
        claim_id: writer-a
        status: in_progress
      item_version: 30b4a9d6ad7fb1968652a29afbef272a426178ca2635d125ff0380e46c3bd2e3
      replayed: false
      array_length: 2
  - type: tool_result.matches
    tool_name: patch_array_item
    which: 5
    result_subset:
      item: *id002
      item_version: 30b4a9d6ad7fb1968652a29afbef272a426178ca2635d125ff0380e46c3bd2e3
      replayed: true
      array_length: 2
  - type: tool_result.matches
    tool_name: patch_array_item
    which: 6
    result_subset:
      error:
        response:
          error_code: ERR_IDEMPOTENCY_MISMATCH
  - type: tool_result.matches
    tool_name: retrieve_entity_snapshot
    which: 0
    result_subset:
      observation_count: 3
      snapshot:
        tasks_claimed:
          - claim_id: writer-a
            status: in_review
          - claim_id: writer-b
            status: in_progress
  - type: tool_result.matches
    tool_name: retrieve_entity_snapshot
    which: 1
    result_subset:
      observation_count: 4
      snapshot:
        tasks_claimed:
          - *id001
          - claim_id: writer-b
            status: in_progress
  - type: tool_result.matches
    tool_name: retrieve_entity_snapshot
    which: 2
    result_subset:
      observation_count: 5
      snapshot:
        tasks_claimed:
          - *id002
          - claim_id: writer-b
            status: in_progress
